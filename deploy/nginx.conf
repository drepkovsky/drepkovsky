server {
    listen 3000;
    server_name cv.drepkovsky.com;
    return 301 https://drepkovsky.com/cv;
}

server {
    listen 3000;
    server_name www.drepkovsky.com;
    return 301 https://drepkovsky.com$request_uri;
}

server {
    listen 3000 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    port_in_redirect off;
    absolute_redirect off;

    location / {
        try_files $uri $uri/ =404;
    }

    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
