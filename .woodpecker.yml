# drepkovsky.com CI — build an immutable image on push to `main`, then bump
# GitOps. Flux rolls the cluster from git; nothing is ever built locally.

when:
  event: [push, manual]
  branch: main

steps:
  # Fails before anything reaches the registry, so a broken build never
  # produces a tag the cluster could be pointed at.
  typecheck:
    image: oven/bun:1.3-alpine
    commands:
      - bun install --frozen-lockfile
      - bun run typecheck

  build:
    # Kaniko builds without privileges; this repository is not trusted and
    # Woodpecker no longer runs plugin-docker-buildx privileged by default.
    # The builder node is amd64, which is the only platform the cluster runs.
    image: woodpeckerci/plugin-kaniko:2
    depends_on: [typecheck]
    settings:
      dockerfile: Dockerfile
      # The plugin skips the push when repo is empty, even with destinations.
      repo: questpie/drepkovsky
      destinations:
        - "questpie/drepkovsky:latest"
        - "questpie/drepkovsky:${CI_COMMIT_SHA}"
      # NEXT_PUBLIC_* is inlined by Next at build time, so it belongs here and
      # not in the deployment env. All four are public by design — they ship
      # in the HTML of every page.
      build-args:
        - "NEXT_PUBLIC_CAP_SITE_KEY=1f19b4ea49"
        - "NEXT_PUBLIC_CAP_BASE_URL=https://cap.eu-infra.questpie.com"
        - "NEXT_PUBLIC_UMAMI_SRC=https://umami.eu-infra.questpie.com/script.js"
        - "NEXT_PUBLIC_UMAMI_ID=e6f5bd74-5208-4fdf-b3d6-a809718dc454"
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password

